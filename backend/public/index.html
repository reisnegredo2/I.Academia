<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA.cademia | Seu Personal Trainer Inteligente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <style>
    :root {
      /* Cores principais */
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #dbeafe;
      --secondary-color: #f8fafc;
      --accent-color: #f59e0b;
      /* Paleta da marca */
      --brand-primary: #2563eb;
      --brand-secondary: #4f46e5;
      --brand-accent: #f59e0b;
      --brand-gradient: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      
      /* Cores de texto */
      --text-color: #1e293b;
      --text-light: #64748b;
      --text-lighter: #94a3b8;
      
      /* Cores de fundo */
      --bg-dark: #0f172a;
      --bg-light: #ffffff;
      --bg-hover: #f1f5f9;
      
      /* Cores de borda */
      --border-color: #e2e8f0;
      --border-dark: #334155;
      
      /* Cores de chat */
      --chat-user-bg: #f8fafc;
      --chat-ai-bg: #ffffff;
      --chat-border: #e2e8f0;
      
      /* Sombras */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      
      /* Gradientes */
      --gradient-primary: linear-gradient(135deg, #2563eb, #4f46e5);
      --gradient-accent: linear-gradient(135deg, #f59e0b, #ef4444);
      
      /* Animações */
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s ease;
      --transition-slow: 0.5s ease;
    }

    /* Tema escuro (profissional) */
    [data-theme="dark"] {
      --primary-color: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: rgba(59, 130, 246, 0.18);
      --secondary-color: #0b1220;
      --accent-color: #f59e0b;

      --text-color: #e5e7eb;
      --text-light: #9ca3af;
      --text-lighter: #6b7280;

      --bg-dark: #0b1220;
      --bg-light: #0f172a;
      --bg-hover: #111827;

      --border-color: #1f2937;
      --border-dark: #111827;

      --chat-user-bg: #0f172a;
      --chat-ai-bg: #0b1220;
      --chat-border: #1f2937;

      --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
      --shadow-md: 0 4px 10px rgba(0,0,0,.35);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.45);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-color);
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(37,99,235,0.06), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(245,158,11,0.05), transparent 60%),
        var(--bg-light);
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background-color: var(--bg-dark);
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      border-right: 1px solid var(--border-dark);
      transition: transform var(--transition-normal);
      z-index: 200;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo .wordmark { font-weight: 800; letter-spacing: -0.4px; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo .brandmark { width: 28px; height: 28px; display:block; }

    .logo span {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .new-chat-btn {
      margin: 20px;
      padding: 14px 20px;
      background: var(--gradient-primary);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-md);
    }

    .new-chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .new-chat-btn i {
      font-size: 18px;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .chat-history {
      list-style: none;
    }

    .chat-history-item {
      padding: 0;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chat-item-content {
      flex: 1;
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text-lighter);
      font-size: 14px;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
    }

    .chat-item-content:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      border-color: var(--border-dark);
    }

    .chat-item-content.active {
      background-color: rgba(255, 255, 255, 0.15);
      color: white;
      border-color: var(--primary-color);
    }

    .chat-history-item i {
      font-size: 16px;
      color: var(--accent-color);
    }

    .chat-delete-btn {
      background: none;
      border: none;
      color: var(--text-lighter);
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: all var(--transition-fast);
      opacity: 0;
      margin-right: 8px;
    }

    .chat-history-item:hover .chat-delete-btn {
      opacity: 1;
    }

    .chat-delete-btn:hover {
      background-color: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .sidebar-footer {
      padding: 20px;
      border-top: 1px solid var(--border-dark);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.05);
      transition: all var(--transition-fast);
    }

    .user-info:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      box-shadow: var(--shadow-md);
    }

    .user-details {
      flex: 1;
    }

    .user-name {
      font-weight: 600;
      font-size: 14px;
      color: white;
    }

    .user-status {
      font-size: 12px;
      color: var(--text-lighter);
    }

    .user-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .user-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: all var(--transition-fast);
      background-color: rgba(255, 255, 255, 0.05);
      color: white;
      flex: 1;
      min-width: 0;
    }

    .user-action-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .user-action-btn i {
      font-size: 14px;
    }

    .login-btn {
      background: var(--gradient-primary);
    }

    .login-btn:hover {
      background: var(--primary-hover);
    }

    .profile-btn {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .logout-btn {
      background: var(--accent-color);
    }

    .logout-btn:hover {
      background: #e67e22;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: 280px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-light);
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 40px 0;
      scroll-behavior: smooth;
    }

    .welcome-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 0 20px;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .welcome-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 24px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      letter-spacing: -0.5px;
      text-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }

    .welcome-subtitle {
      font-size: 20px;
      color: var(--text-light);
      max-width: 600px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .suggestion-card {
      background-color: var(--bg-light);
      padding: 24px;
      border-radius: 16px;
      cursor: pointer;
      transition: all var(--transition-normal);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .suggestion-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary-color);
    }

    .suggestion-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      margin-bottom: 8px;
      box-shadow: 0 10px 20px rgba(37,99,235,0.25);
    }

    .suggestion-title {
      font-weight: 600;
      font-size: 18px;
      color: var(--text-color);
    }

    .suggestion-text {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.6;
    }

    .chat-message {
      padding: 32px;
      display: flex;
      gap: 20px;
      animation: messageAppear var(--transition-normal);
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-message.user {
      background-color: var(--chat-user-bg);
      border-bottom: 1px solid var(--chat-border);
    }

    .chat-message.ai {
      background-color: var(--chat-ai-bg);
      border-bottom: 1px solid var(--chat-border);
    }

    .message-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 20px;
      box-shadow: var(--shadow-md);
    }

    .message-avatar.user {
      background: var(--gradient-primary);
      color: white;
    }

    .message-avatar.ai {
      background: var(--gradient-accent);
      color: white;
    }

    .message-content {
      flex: 1;
      max-width: 800px;
    }

    /* Alinhar mensagens do usuário à direita */
    .chat-message.user { flex-direction: row-reverse; }
    .chat-message.user .message-content { text-align: right; }
    .chat-message.user .message-text { text-align: right; }

    .message-text {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-color);
      max-width: 800px;
    }

    .message-text h1,
    .message-text h2,
    .message-text h3,
    .message-text h4 {
      color: var(--text-color);
      font-weight: 600;
      margin: 1.5em 0 0.8em;
      line-height: 1.3;
    }

    .message-text h1 {
      font-size: 1.8em;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.3em;
    }

    .message-text h2 {
      font-size: 1.5em;
      color: var(--primary-color);
    }

    .message-text h3 {
      font-size: 1.3em;
    }

    .message-text h4 {
      font-size: 1.1em;
      color: var(--text-light);
    }

    .message-text p {
      margin: 1em 0;
      line-height: 1.7;
    }

    .message-text ul,
    .message-text ol {
      margin: 1em 0;
      padding-left: 1.5em;
    }

    .message-text li {
      margin: 0.5em 0;
      line-height: 1.6;
    }

    .message-text li::marker {
      color: var(--primary-color);
    }

    .message-text blockquote {
      margin: 1em 0;
      padding: 0.5em 1em;
      border-left: 4px solid var(--primary-color);
      background-color: var(--primary-light);
      color: var(--text-color);
    }

    .message-text code {
      background-color: var(--bg-hover);
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.9em;
    }

    .message-text pre {
      background-color: var(--bg-hover);
      padding: 1em;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1em 0;
    }

    .message-text pre code {
      background-color: transparent;
      padding: 0;
    }

    .message-text hr {
      margin: 2em 0;
      border: none;
      border-top: 2px solid var(--border-color);
    }

    .message-text table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }

    .message-text th,
    .message-text td {
      border: 1px solid var(--border-color);
      padding: 0.75em;
      text-align: left;
    }

    .message-text th {
      background-color: var(--bg-hover);
      font-weight: 600;
    }

    .message-text img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 1em 0;
    }

    .message-text a {
      color: var(--primary-color);
      text-decoration: none;
    }

    .message-text a:hover {
      text-decoration: underline;
    }

    /* Estilos específicos para blocos de exercício */
    .message-text .exercise-block {
      background-color: var(--bg-hover);
      border-radius: 8px;
      padding: 1.5em;
      margin: 1.5em 0;
      border: 1px solid var(--border-color);
    }

    .message-text .exercise-title {
      color: var(--primary-color);
      font-size: 1.3em;
      font-weight: 600;
      margin-bottom: 1em;
    }

    .message-text .exercise-section {
      margin: 1em 0;
    }

    .message-text .exercise-section-title {
      font-weight: 600;
      color: var(--text-color);
      margin-bottom: 0.5em;
    }

    .message-text .exercise-list {
      list-style: none;
      padding-left: 0;
    }

    .message-text .exercise-list li {
      position: relative;
      padding-left: 1.5em;
      margin: 0.5em 0;
    }

    .message-text .exercise-list li::before {
      content: "•";
      position: absolute;
      left: 0.5em;
      color: var(--primary-color);
    }

    .input-container {
      padding: 24px;
      background-color: var(--bg-light);
      border-top: 1px solid var(--border-color);
      position: relative;
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      display: flex;
      gap: 12px;
    }

    .message-input {
      flex: 1;
      padding: 16px 20px;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-color);
      background-color: var(--bg-light);
      transition: all var(--transition-fast);
      resize: none;
      min-height: 56px;
      max-height: 200px;
    }

    .message-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px var(--primary-light);
    }

    .send-button {
      padding: 16px;
      background: var(--gradient-primary);
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-md);
    }

    .send-button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .send-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .send-button i {
      font-size: 20px;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background-color: var(--primary-light);
      border-radius: 12px;
      width: fit-content;
      margin-top: 8px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background-color: var(--primary-color);
      border-radius: 50%;
      animation: typingAnimation 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingAnimation {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-4px);
      }
    }

    /* Responsividade */
    @media (max-width: 1024px) {
      .sidebar {
        transform: translateX(-100%);
        width: 85vw;
        box-shadow: 0 10px 30px rgba(0,0,0,.4);
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
      }

      .new-chat-btn { margin: 12px; padding: 12px 16px; }

      .chat-container {
        padding: 12px 0;
      }

      .message-content { max-width: 100%; }

      .welcome-title {
        font-size: 28px;
        margin-bottom: 16px;
      }

      .welcome-subtitle {
        font-size: 16px;
        margin-bottom: 24px;
      }

      .chat-message {
        padding: 14px;
        gap: 12px;
      }

      .message-avatar {
        width: 32px;
        height: 32px;
        font-size: 14px;
      }

      .message-text {
        font-size: 14px;
      }

      .input-container { padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }

      /* Mostrar header e botões no mobile */
      .mobile-header { display: flex; }
      .mobile-header-spacer { display: block; }
      .fab-menu { display: flex; }
      .sidebar-close { display: inline-flex; }
    }

    /* Utilitários */
    .hidden {
      display: none !important;
    }

    .fade-in {
      animation: fadeIn var(--transition-normal);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Cabeçalho móvel */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.3))
                  , var(--bg-light);
      border-bottom: 1px solid var(--border-color);
      z-index: 101;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
    }
    .mobile-header button {
      width: 40px; height: 40px;
      border: none; border-radius: 10px;
      background: var(--bg-hover);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .mobile-header-spacer { display: none; height: 56px; }

    /* Botão flutuante de menu no mobile */
    .fab-menu {
      display: none;
      position: fixed;
      left: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 48px; height: 48px;
      border-radius: 14px;
      border: none;
      background: var(--bg-dark);
      color: #fff;
      box-shadow: var(--shadow-lg);
      z-index: 110;
      align-items: center; justify-content: center;
    }

    .sidebar-close {
      display: none;
      margin-left: auto;
      width: 36px; height: 36px;
      border: none; border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      display: none;
    }

    /* Overlay para sidebar no mobile */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      z-index: 90;
    }

    /* Sticky input + safe-area */
    .input-container {
      padding: 24px;
      background-color: var(--bg-light);
      border-top: 1px solid var(--border-color);
      position: sticky;
      bottom: 0;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      backdrop-filter: saturate(180%) blur(10px);
    }

    /* Botão de tema */
    .theme-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-light);
      color: var(--text-color);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .theme-toggle-btn:hover { background: var(--bg-hover); transform: translateY(-2px); }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-light);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--text-lighter);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-light);
    }

    /* Adiciona estilos específicos para a formatação */
    .message-text ul {
      list-style: none;
      padding-left: 0;
      margin: 16px 0;
    }
    
    .message-text li {
      position: relative;
      padding-left: 24px;
      margin-bottom: 8px;
    }
    
    .message-text li:before {
      content: "•";
      position: absolute;
      left: 8px;
      color: var(--primary-color);
    }
    
    .message-text strong {
      display: block;
      font-size: 1.2em;
      margin: 24px 0 16px;
      color: var(--text-color);
    }
    
    .message-text strong:first-child {
      margin-top: 0;
    }
    
    .message-text br {
      content: "";
      display: block;
      margin: 8px 0;
    }

    /* Modal / Form padrão */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:12px; }
    .modal-card { background: var(--bg-light); border:1px solid var(--border-color); border-radius:16px; padding:0; width:100%; max-width:520px; box-shadow: var(--shadow-lg); overflow:hidden; }
    .modal-header { padding:16px 20px; background: var(--brand-gradient); color:#fff; display:flex; align-items:center; gap:10px; }
    .modal-title { font-weight:800; letter-spacing:-0.3px; }
    .modal-subtitle { color:#e5e7eb; font-size:13px; }
    .modal-body { padding:20px; display:flex; flex-direction:column; gap:14px; }
    .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-label { font-size:12px; color: var(--text-light); font-weight:600; margin-bottom:6px; }
    /* Switch de tema */
    .switch { position: relative; display:inline-block; width: 46px; height: 26px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; cursor:pointer; inset:0; background: var(--border-color); border-radius:999px; transition: all var(--transition-normal); }
    .slider:before { content:""; position:absolute; height:20px; width:20px; left:3px; top:3px; background:white; border-radius:50%; transition: all var(--transition-normal); box-shadow: var(--shadow-sm); }
    input:checked + .slider { background: var(--primary-color); }
    input:checked + .slider:before { transform: translateX(20px); }
    .tab-buttons { display:flex; gap:8px; margin-bottom:12px; }
    .tab-button { flex:1; padding:12px; border:1px solid var(--border-color); border-radius:10px; background:#f8fafc; cursor:pointer; font-weight:600; }
    .tab-button.active { background: var(--gradient-primary); color:#fff; border-color: transparent; }
    .input-with-icon { position:relative; }
    .input-with-icon i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color: var(--text-lighter); }
    .text-input { padding:12px 12px 12px 36px; border:1px solid var(--border-color); border-radius:10px; width:100%; background: var(--bg-light); color: var(--text-color); }
    .text-input:focus { outline:none; border-color: var(--primary-color); box-shadow: 0 0 0 4px var(--primary-light); }
    .primary-btn { padding:12px; border:none; border-radius:10px; background: var(--gradient-primary); color:#fff; font-weight:600; cursor:pointer; }
    .google-btn { padding:12px; border:1px solid var(--border-color); border-radius:10px; background:#fff; font-weight:600; cursor:pointer; display:flex; alinhamento:center; justify-content:center; gap:8px; }
    .section-title { font-weight:700; margin-bottom:8px; }

    /* Toaster */
    #toastContainer { position: fixed; right: 16px; top: 16px; display:flex; flex-direction:column; gap:10px; z-index: 9999; }
    .toast { padding: 12px 14px; border-radius: 10px; color: #fff; box-shadow: var(--shadow-md); animation: fadeIn var(--transition-normal); font-weight:600; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }
    .toast.info { background: #2563eb; }

    /* Ficha compact UI */
    .fx-card { border:1px solid var(--border-color); border-radius:12px; padding:12px; background: var(--bg-light); box-shadow: var(--shadow-sm); }
    .fx-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .fx-title { font-weight:700; }
    .fx-sub { color: var(--text-light); font-size: 13px; }
    .fx-badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background: var(--primary-light); color: var(--primary-color); font-weight:600; }
    .fx-actions { display:flex; gap:8px; align-items:center; }
    .fx-list { display:flex; flex-direction:column; gap:10px; }
    .fx-section { max-height:420px; overflow:auto; border:1px solid var(--border-color); border-radius:12px; padding:12px; background: var(--bg-light); }
    .fx-empty { border:2px dashed var(--border-color); border-radius:12px; padding:20px; display:flex; align-items:center; justify-content:center; color: var(--text-light); background: transparent; }
    .fx-empty .create-btn { margin-left:10px; padding:8px 12px; border:none; border-radius:10px; background: var (--gradient-primary); color:#fff; font-weight:700; cursor:pointer; }
    .fx-footer { position: sticky; bottom: 0; background: var(--bg-light); border-top: 1px solid var(--border-color); padding: 10px; display:flex; justify-content:space-between; gap:8px; border-bottom-left-radius:16px; border-bottom-right-radius:16px; }
    /* Modo de visualização vs edição */
    #fichaModal[data-mode="view"] .fx-edit-only { display: none !important; }
    #fichaModal[data-mode="edit"] .fx-view-only { display: none !important; }
  </style>
</head>
